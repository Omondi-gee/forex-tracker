<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live FOREX Session Monitor & Widget</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: #131c2e;
            --widget-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-orange: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 20px;
        }

        h1 { margin: 0; font-size: 1.6rem; letter-spacing: -0.5px; }
        
        .time-display {
            text-align: right;
        }

        /* LIVE WIDGET STYLE */
        .live-widget {
            background: linear-gradient(135deg, var(--widget-bg) 0%, #0f172a 100%);
            border: 2px solid var(--accent-blue);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .widget-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-blue);
            margin: 0 0 10px 0;
            font-weight: bold;
        }

        .widget-content {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .active-session-pill {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.9; }
            50% { opacity: 1; border-color: #34d399; }
            100% { opacity: 0.9; }
        }

        .no-sessions {
            color: var(--text-muted);
            font-style: italic;
        }

        .btn {
            background-color: var(--accent-orange);
            color: #000;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn.granted { background-color: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); cursor: default; transform: none; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .card.active {
            border-color: var(--accent-green);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            background: #334155;
            color: var(--text-muted);
        }

        .active .status-badge {
            background: var(--accent-green);
            color: #000;
        }

        .countdown {
            font-size: 1.6rem;
            font-weight: bold;
            margin: 15px 0 5px 0;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.5px;
        }

        .local-hours {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>FX Terminal</h1>
            <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">Pop-up alerts armed via Web Notification standards</div>
        </div>
        <div class="time-display">
            <button id="notify-btn" class="btn" onclick="requestNotifications()">⚠️ Enable Screen Pop-ups</button>
            <div id="local-clock" style="font-size: 1.3rem; font-weight: bold; margin-top: 8px; font-variant-numeric: tabular-nums;">--:--:--</div>
        </div>
    </header>

    <!-- LIVE HOME SCREEN WIDGET CONTAINER -->
    <div class="live-widget">
        <div class="widget-title">📡 Current Running Sessions</div>
        <div class="widget-content" id="live-widget-content">
            <span class="no-sessions">Calculating active global markets...</span>
        </div>
    </div>

    <div class="grid" id="session-grid">
        <!-- Generated by JavaScript -->
    </div>
</div>

<script>
    // Global FX Sessions Defined in UTC
    const sessions = [
        { name: "Sydney", openUTC: 22, closeUTC: 7, color: "#3b82f6" },
        { name: "Tokyo", openUTC: 0, closeUTC: 9, color: "#a855f7" },
        { name: "London", openUTC: 8, closeUTC: 17, color: "#f59e0b" },
        { name: "New York", openUTC: 13, closeUTC: 22, color: "#ec4899" }
    ];

    let lastStates = {};

    function initCards() {
        const grid = document.getElementById('session-grid');
        grid.innerHTML = '';
        sessions.forEach(s => {
            lastStates[s.name] = null; 
            
            const localOpen = (s.openUTC - (new Date().getTimezoneOffset()/60) + 24) % 24;
            const localClose = (s.closeUTC - (new Date().getTimezoneOffset()/60) + 24) % 24;
            const pad = (n) => String(n).padStart(2, '0');

            grid.innerHTML += `
                <div class="card" id="card-${s.name}">
                    <div class="card-header">
                        <span style="font-weight: bold; font-size: 1.1rem; color: ${s.color}">${s.name}</span>
                        <span class="status-badge" id="badge-${s.name}">CLOSED</span>
                    </div>
                    <div class="local-hours">Local Session: ${pad(localOpen)}:00 - ${pad(localClose)}:00</div>
                    <div class="countdown" id="count-${s.name}">--:--:--</div>
                    <div id="label-${s.name}" style="font-size: 0.75rem; color: var(--text-muted)">loading...</div>
                </div>
            `;
        });
    }

    function triggerPopUp(sessionName, isActive) {
        if (lastStates[sessionName] !== null && lastStates[sessionName] !== isActive) {
            const statusText = isActive ? "OPENED" : "CLOSED";
            const iconSymbol = isActive ? "🟢" : "🔴";
            const title = `${iconSymbol} ${sessionName} Session ${statusText}`;
            const options = {
                body: `The ${sessionName} market is officially ${statusText.toLowerCase()} for global trading operations.`,
                requireInteraction: true // Keeps the pop-up visible until you dismiss it!
            };

            // Fire standard browser OS pop-up alert
            if (Notification.permission === "granted") {
                new Notification(title, options);
            }

            // Fallback Text-To-Speech audio alert if tab is out of view
            try {
                const speech = new SpeechSynthesisUtterance(`${sessionName} session is now ${statusText.toLowerCase()}`);
                window.speechSynthesis.speak(speech);
            } catch(e) {}
        }
        lastStates[sessionName] = isActive;
    }

    function updateTracker() {
        const now = new Date();
        document.getElementById('local-clock').innerText = now.toLocaleTimeString();

        const utcHour = now.getUTCHours();
        const utcMin = now.getUTCMinutes();
        const utcSec = now.getUTCSeconds();
        const totalUtcSeconds = (utcHour * 3600) + (utcMin * 60) + utcSec;

        let activeSessionNames = [];

        sessions.forEach(s => {
            const openSec = s.openUTC * 3600;
            const closeSec = s.closeUTC * 3600;
            
            let isActive = false;
            let targetSec = 0;
            let labelText = "";

            if (openSec < closeSec) {
                if (totalUtcSeconds >= openSec && totalUtcSeconds < closeSec) {
                    isActive = true;
                    targetSec = closeSec;
                    labelText = "Closes in";
                } else {
                    isActive = false;
                    targetSec = totalUtcSeconds < openSec ? openSec : openSec + (24 * 3600);
                    labelText = "Opens in";
                }
            } else {
                if (totalUtcSeconds >= openSec || totalUtcSeconds < closeSec) {
                    isActive = true;
                    targetSec = totalUtcSeconds >= openSec ? closeSec + (24 * 3600) : closeSec;
                    labelText = "Closes in";
                } else {
                    isActive = false;
                    targetSec = openSec;
                    labelText = "Opens in";
                }
            }

            let diffSec = targetSec - totalUtcSeconds;
            const h = Math.floor(diffSec / 3600);
            const m = Math.floor((diffSec % 3600) / 60);
            const sec = diffSec % 60;

            const card = document.getElementById(`card-${s.name}`);
            const badge = document.getElementById(`badge-${s.name}`);
            const count = document.getElementById(`count-${s.name}`);
            const label = document.getElementById(`label-${s.name}`);

            if (isActive) {
                card.classList.add('active');
                badge.innerText = "ACTIVE";
                activeSessionNames.push(s.name);
            } else {
                card.classList.remove('active');
                badge.innerText = "CLOSED";
            }

            count.innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
            label.innerText = labelText;

            triggerPopUp(s.name, isActive);
        });

        // UPDATE HOME WIDGET STATUS
        const widgetContent = document.getElementById('live-widget-content');
        if (activeSessionNames.length > 0) {
            widgetContent.innerHTML = activeSessionNames.map(name => `
                <div class="active-session-pill">
                    <span style="width: 8px; height: 8px; background-color: var(--accent-green); border-radius: 50%;"></span>
                    ${name} Session
                </div>
            `).join('');
        } else {
            widgetContent.innerHTML = `<span class="no-sessions">💤 All Major Sessions Closed (Weekend / Gap)</span>`;
        }
    }

    function requestNotifications() {
        Notification.requestPermission().then(permission => {
            const btn = document.getElementById('notify-btn');
            if (permission === "granted") {
                btn.innerText = "✓ Screen Pop-ups Active";
                btn.className = "btn granted";
                btn.disabled = true;
            }
        });
    }

    if (Notification.permission === "granted") {
        const btn = document.getElementById('notify-btn');
        btn.innerText = "✓ Screen Pop-ups Active";
        btn.className = "btn granted";
        btn.disabled = true;
    }

    initCards();
    updateTracker();
    setInterval(updateTracker, 1000);
</script>
</body>
</html># forex-tracker
